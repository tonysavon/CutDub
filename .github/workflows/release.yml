name: Build release archives

on:
  workflow_dispatch:

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Read project version
        shell: bash
        run: echo "VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_ENV"
      - name: Package macOS
        if: runner.os == 'macOS'
        run: ./scripts/package-macos.sh "$VERSION" "${{ matrix.target }}"
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Version "$env:VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: CutDub-${{ env.VERSION }}-${{ matrix.target }}
          path: |
            releases/${{ env.VERSION }}/*.zip
            releases/${{ env.VERSION }}/*.tar.gz
          if-no-files-found: error
